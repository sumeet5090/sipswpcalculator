name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        tools: composer:v2

    - name: Validate composer.json
      run: composer validate --strict || true

    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node Dependencies
      run: npm ci

    - name: Build Frontend Assets
      run: npm run build

    - name: Sync to Production via FTP
      if: github.ref == 'refs/heads/main'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /domains/sipswpcalculator.com/public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          **/.agents/**
          **/.DS_Store/**
          **/.phpunit.cache/**
          **/.vscode/**
          **/tests/**
          **/docker/**
          **/Dockerfile
          **/docker-compose.yml
          **/package.json
          **/package-lock.json
          **/node_modules/**
          **/resources/**
          **/.env
          **/README.md
          **/phpcs.xml
          **/phpstan.neon
          phpunit.xml

    - name: Run Database Migrations
      if: github.ref == 'refs/heads/main'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 65002
        script: |
          cd domains/sipswpcalculator.com/public_html
          php scripts/migrate.php
