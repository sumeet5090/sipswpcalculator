name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, gd, mbstring, dom, curl
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Typecheck & Build Frontend Assets
        run: npm run build

      - name: Run PHP/TypeScript Math Parity Suite
        run: php tests/parity_check.php

      - name: Run PHPStan, PSR-12 & PHPUnit Suite
        run: composer check-all

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict || true

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Setup SSH and Known Hosts
        if: github.ref == 'refs/heads/main'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_ed25519
          known_hosts: ${{ secrets.KNOWN_HOSTS }} # Ensure your 3 scanning lines are inside this secret
          if_key_exists: replace

      - name: Deploy to Server (Atomic Symlink)
        if: github.ref == 'refs/heads/main'
        env:
          SERVER: ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}
          PORT: 65002
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          RELEASE_DIR="domains/sipswpcalculator.com/releases/$TIMESTAMP"

          # 1. Create release directory
          ssh -p $PORT $SERVER "mkdir -p $RELEASE_DIR"

          # 2. Rsync files to the new release directory
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='.agents/' \
            --exclude='.DS_Store' \
            --exclude='.phpunit.cache/' \
            --exclude='.vscode/' \
            --exclude='tests/' \
            --exclude='docker/' \
            --exclude='Dockerfile' \
            --exclude='docker-compose.yml' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='node_modules/' \
            --exclude='resources/' \
            --exclude='.env' \
            --exclude='README.md' \
            --exclude='phpcs.xml' \
            --exclude='phpstan.neon' \
            --exclude='phpunit.xml' \
            -e "ssh -p $PORT" \
            ./ $SERVER:$RELEASE_DIR/

          # 3. Swap the symlink and clean up old releases
          # NOTE: We use "EOF" instead of EOF so that local variables like $TIMESTAMP resolve before going to the server.
          ssh -p $PORT $SERVER << "EOF"
            cd domains/sipswpcalculator.com || exit 1
            
            # Find the current release timestamp from the folder we just created
            LATEST_RELEASE=$(ls -1dt releases/* | head -n 1 | awk -F'/' '{print $2}')
            echo "Deploying release: $LATEST_RELEASE"

            # Ensure a shared .env file exists
            if [ ! -f ".env" ]; then
              echo "ENVIRONMENT=production" > .env
            fi

            # Symlink the shared .env into the new release
            ln -sfn "../../.env" "releases/$LATEST_RELEASE/.env"

            # Create cache directory for Twig in the release
            mkdir -p "releases/$LATEST_RELEASE/var/cache/twig"

            # First time setup: if public_html is a directory and NOT a symlink
            if [ -d "public_html" ] && [ ! -L "public_html" ]; then
              echo "Transitioning public_html from directory to symlink..."
              mv public_html "public_html_backup_$(date +%s)"
              ln -sfn "releases/$LATEST_RELEASE" public_html
            else
              # Atomic symlink swap
              ln -sfn "releases/$LATEST_RELEASE" public_html_new
              mv -Tf public_html_new public_html
            fi
            
            # Run database migrations
            cd public_html || exit 1
            if [ -f "bin/migrate" ]; then
              php bin/migrate
            fi
            cd ..
            
            # Clean up old releases (keep latest 3)
            ls -1dt releases/* | tail -n +4 | xargs -I {} rm -rf "{}" || true
          EOF

      - name: Post-Deploy Live HTTP Smoke Check
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          BASE_URL="https://sipswpcalculator.com"
          for path in / /sip-calculator /swp-calculator /epf-calculator /ltcg-tax-calculator /income-tax-calculator /about /resources /glossary /embed/sip-calculator; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "${BASE_URL}${path}")
            echo "GET ${path} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "Smoke check failed for ${path} (HTTP ${code})"
              exit 1
            fi
          done

          curl -fsS "${BASE_URL}/sitemap.xml" | grep -q "<urlset"
          echo "GET /sitemap.xml -> 200 (<urlset> verified)"

          csv_code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -d "mode=sip&sip=10000&years=10&rate=12&stepup=0&lumpsum=0" "${BASE_URL}/download-csv")
          echo "POST /download-csv -> ${csv_code}"
          [ "$csv_code" = "200" ]

          pdf_code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -d "mode=sip&sip=10000&years=10&rate=12&stepup=0&lumpsum=0" "${BASE_URL}/generate-pdf")
          echo "POST /generate-pdf -> ${pdf_code}"
          [ "$pdf_code" = "200" ]

      - name: Submit Updated URLs to IndexNow
        if: github.ref == 'refs/heads/main'
        run: php bin/indexnow || true
