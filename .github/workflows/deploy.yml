name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        tools: composer:v2

    - name: Validate composer.json
      run: composer validate --strict || true

    - name: Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node Dependencies
      run: npm ci

    - name: Build Frontend Assets
      run: npm run build

    - name: Setup SSH
      if: github.ref == 'refs/heads/main'
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add Host to Known Hosts
      if: github.ref == 'refs/heads/main'
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts

    - name: Deploy to Server (Atomic Symlink)
      if: github.ref == 'refs/heads/main'
      env:
        SERVER: ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}
        PORT: 65002
      run: |
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        RELEASE_DIR="domains/sipswpcalculator.com/releases/$TIMESTAMP"
        
        # 1. Create release directory
        ssh -p $PORT $SERVER "mkdir -p $RELEASE_DIR"
        
        # 2. Rsync files to the new release directory
        rsync -avz --delete \
          --exclude='.git*' \
          --exclude='.github/' \
          --exclude='.agents/' \
          --exclude='.DS_Store' \
          --exclude='.phpunit.cache/' \
          --exclude='.vscode/' \
          --exclude='tests/' \
          --exclude='docker/' \
          --exclude='Dockerfile' \
          --exclude='docker-compose.yml' \
          --exclude='package.json' \
          --exclude='package-lock.json' \
          --exclude='node_modules/' \
          --exclude='resources/' \
          --exclude='.env' \
          --exclude='README.md' \
          --exclude='phpcs.xml' \
          --exclude='phpstan.neon' \
          --exclude='phpunit.xml' \
          -e "ssh -p $PORT" \
          ./ $SERVER:$RELEASE_DIR/
        
        # 3. Swap the symlink and clean up old releases
        ssh -p $PORT $SERVER << EOF
          cd domains/sipswpcalculator.com
          
          # First time setup: if public_html is a directory and NOT a symlink
          if [ -d "public_html" ] && [ ! -L "public_html" ]; then
            echo "Transitioning public_html from directory to symlink..."
            mv public_html public_html_backup_\$(date +%s)
            ln -sfn releases/$TIMESTAMP public_html
          else
            # Atomic symlink swap
            ln -sfn releases/$TIMESTAMP public_html_new
            mv -Tf public_html_new public_html
          fi
          
          # Run database migrations
          cd public_html
          php scripts/migrate.php
          cd ..
          
          # Clean up old releases (keep latest 3)
          ls -1dt releases/* | tail -n +4 | xargs -d '\n' rm -rf -- || true
        EOF
